interface Vlan1
 no ip address
 shutdown
!
interface Vlan2
 no ip address
!
interface Vlan10
 ip address 172.20.143.238 255.255.255.240
 ip helper-address 172.20.143.249
 ip helper-address 172.20.143.253
 ipv6 address 2002:A019:B349::1/64
!
interface Vlan20
 ip address 172.20.143.126 255.255.255.128
 ip helper-address 172.20.143.249
 ip helper-address 172.20.143.253
 ipv6 address 2002:A019:B349:1::1/64
!
interface Vlan30
 ip address 172.20.142.254 255.255.255.0
 ip helper-address 172.20.143.249
 ip helper-address 172.20.143.253
 ipv6 address 2002:A019:B349:2::1/64
!
interface Vlan40
 ip address 172.20.143.222 255.255.255.224
 ip helper-address 172.20.143.249
 ip helper-address 172.20.143.253
 ipv6 address 2002:A019:B349:3::1/64
