router ospf 2
 log-adjacency-changes
 redistribute connected subnets
 redistribute static subnets
 redistribute ospf 1
 network 172.20.142.0 0.0.0.255 area 4
 network 172.20.143.0 0.0.0.127 area 4
 network 172.20.143.192 0.0.0.31 area 4
 network 172.20.143.224 0.0.0.15 area 4
 network 172.20.143.240 0.0.0.15 area 4
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
ipv6 router rip proc1
 redistribute connected
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
banner exec 

***************************************************************
This is a normal Router with a SW module inside (NM-16ESW)
It has been preconfigured with hard coded speed and duplex

To create vlans use the command "vlan database" from exec mode
After creating all desired vlans use "exit" to apply the config

To view existing vlans use the command "show vlan-switch brief"

Warning: You are using an old IOS image for this router.
Please update the IOS to enable the "macro" command!
***************************************************************


!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
